<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelForge · Canva + Lightroom style editor</title>
  <!-- Google Font & Font Awesome for icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #1e1e2f;
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
    }

    /* header / brand */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 2rem;
      color: #a78bfa;
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #c4b5fd, #a78bfa, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: #2d2d44;
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .btn-primary {
      background: #7c3aed;
      box-shadow: 0 6px 14px rgba(124, 58, 237, 0.4);
    }

    .btn-primary:hover {
      background: #6d28d9;
      transform: translateY(-2px);
    }

    .btn:hover {
      background: #3d3d5a;
    }

    .btn-primary:hover {
      background: #6d28d9;
    }

    .btn i {
      font-size: 1rem;
    }

    /* main editor layout */
    .editor-container {
      display: flex;
      flex: 1;
      gap: 24px;
      flex-wrap: wrap;
    }

    /* left sidebar — tools & filters */
    .toolbar {
      width: 280px;
      background: #232338;
      border-radius: 28px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      border: 1px solid #2e2e46;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9d9db5;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .filter-card {
      background: #2e2e46;
      border-radius: 18px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid #3a3a58;
      font-size: 0.75rem;
      font-weight: 500;
      color: #cfcfe6;
    }

    .filter-card i {
      font-size: 1.4rem;
      color: #a78bfa;
    }

    .filter-card:hover {
      background: #3a3a58;
      transform: scale(1.02);
      border-color: #7c3aed;
    }

    .filter-card.active {
      background: #7c3aed;
      border-color: #c4b5fd;
      color: white;
    }

    .filter-card.active i {
      color: white;
    }

    /* sliders */
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 500;
      color: #bfbfd9;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: #3d3d5a;
      border-radius: 10px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #a78bfa;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px #7c3aed;
      transition: 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #c4b5fd;
      transform: scale(1.1);
    }

    /* color adjustments block */
    .color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2e2e46;
      padding: 8px 12px;
      border-radius: 40px;
      margin-bottom: 10px;
    }

    .color-row span {
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-row input[type="color"] {
      width: 32px;
      height: 32px;
      border: 2px solid #55557a;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }

    /* main canvas area */
    .canvas-area {
      flex: 1;
      min-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .canvas-card {
      background: #232338;
      border-radius: 32px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid #2e2e46;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 480px;
      position: relative;
    }

    #imageCanvas {
      max-width: 100%;
      max-height: 520px;
      border-radius: 18px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
      background: #14141f;
      transition: filter 0.1s ease;
      object-fit: contain;
      display: block;
    }

    .canvas-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: #7b7b9b;
      font-size: 1.1rem;
    }

    .canvas-placeholder i {
      font-size: 4rem;
      color: #4a4a6a;
    }

    /* background & remove bg row */
    .background-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }

    .bg-btn {
      background: #2d2d44;
      border: none;
      color: white;
      padding: 12px 18px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .bg-btn:hover {
      background: #3d3d5a;
      transform: translateY(-2px);
    }

    .bg-btn i {
      color: #a78bfa;
    }

    /* hidden file input */
    #fileInput {
      display: none;
    }

    /* status / toast */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #2d2d44;
      border-left: 6px solid #a78bfa;
      padding: 14px 24px;
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
      font-weight: 500;
      color: #e0e0ff;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* responsive */
    @media (max-width: 900px) {
      .toolbar {
        width: 100%;
      }
      .editor-container {
        flex-direction: column;
      }
    }

    .github-corner {
      font-size: 0.85rem;
      color: #8b8baa;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .github-corner a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-note {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: #6b6b8b;
    }

    .bg-option {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      justify-content: center;
    }
    .bg-swatch {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 2px solid #3d3d5a;
      cursor: pointer;
    }
    .bg-swatch.active {
      border-color: #a78bfa;
      box-shadow: 0 0 12px #7c3aed;
    }
  </style>
</head>
<body>
  <!-- header -->
  <header class="app-header">
    <div class="logo-area">
      <i class="fas fa-magic logo-icon"></i>
      <span class="logo-text">PixelForge</span>
    </div>
    <div class="header-actions">
      <button class="btn" id="uploadBtn"><i class="fas fa-cloud-upload-alt"></i> Upload</button>
      <button class="btn btn-primary" id="downloadBtn"><i class="fas fa-download"></i> Download</button>
    </div>
  </header>

  <!-- hidden file input -->
  <input type="file" id="fileInput" accept="image/*">

  <!-- main editor -->
  <div class="editor-container">
    <!-- left sidebar -->
    <aside class="toolbar">
      <!-- Filters -->
      <div>
        <div class="section-title"><i class="fas fa-sliders-h"></i> Filters & effects</div>
        <div class="filter-grid" id="filterGrid">
          <div class="filter-card" data-filter="none"><i class="fas fa-ban"></i> None</div>
          <div class="filter-card" data-filter="grayscale"><i class="fas fa-adjust"></i> B&W</div>
          <div class="filter-card" data-filter="sepia"><i class="fas fa-coffee"></i> Sepia</div>
          <div class="filter-card" data-filter="invert"><i class="fas fa-exchange-alt"></i> Invert</div>
          <div class="filter-card" data-filter="blur"><i class="fas fa-water"></i> Blur</div>
          <div class="filter-card" data-filter="brightness"><i class="fas fa-sun"></i> Bright</div>
          <div class="filter-card" data-filter="contrast"><i class="fas fa-adjust"></i> Contrast</div>
          <div class="filter-card" data-filter="saturate"><i class="fas fa-tint"></i> Vivid</div>
        </div>
      </div>

      <!-- Blur + color intensity sliders -->
      <div class="slider-group">
        <div class="section-title"><i class="fas fa-magic"></i> Adjust</div>
        <div class="slider-item">
          <div class="slider-label"><span>Blur</span> <span id="blurValue">0px</span></div>
          <input type="range" id="blurSlider" min="0" max="20" value="0" step="0.5">
        </div>
        <div class="slider-item">
          <div class="slider-label"><span>Brightness</span> <span id="brightnessValue">100%</span></div>
          <input type="range" id="brightnessSlider" min="0" max="200" value="100" step="1">
        </div>
        <div class="slider-item">
          <div class="slider-label"><span>Contrast</span> <span id="contrastValue">100%</span></div>
          <input type="range" id="contrastSlider" min="0" max="200" value="100" step="1">
        </div>
        <div class="slider-item">
          <div class="slider-label"><span>Saturation</span> <span id="saturateValue">100%</span></div>
          <input type="range" id="saturateSlider" min="0" max="200" value="100" step="1">
        </div>
      </div>

      <!-- Color tint (lightroom style) -->
      <div>
        <div class="section-title"><i class="fas fa-palette"></i> Color tint</div>
        <div class="color-row">
          <span><i class="fas fa-fill-drip"></i> Tint color</span>
          <input type="color" id="tintColor" value="#a78bfa">
        </div>
        <div class="slider-item">
          <div class="slider-label"><span>Tint intensity</span> <span id="tintValue">0%</span></div>
          <input type="range" id="tintSlider" min="0" max="100" value="0" step="1">
        </div>
      </div>

      <!-- Background & remove bg tools -->
      <div>
        <div class="section-title"><i class="fas fa-image"></i> Background</div>
        <div class="background-actions" style="flex-direction: column; gap: 8px;">
          <button class="bg-btn" id="removeBgBtn"><i class="fas fa-cut"></i> Remove background (white)</button>
          <button class="bg-btn" id="setTransparentBtn"><i class="fas fa-chess-board"></i> Transparent background</button>
          <div class="bg-option">
            <div class="bg-swatch" style="background: #ffffff;" data-bg="#ffffff"></div>
            <div class="bg-swatch" style="background: #000000;" data-bg="#000000"></div>
            <div class="bg-swatch" style="background: #ffd966;" data-bg="#ffd966"></div>
            <div class="bg-swatch" style="background: #b4e6b2;" data-bg="#b4e6b2"></div>
            <div class="bg-swatch" style="background: #a7d0f0;" data-bg="#a7d0f0"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- canvas / main preview -->
    <main class="canvas-area">
      <div class="canvas-card" id="canvasCard">
        <canvas id="imageCanvas" width="800" height="600"></canvas>
        <div class="canvas-placeholder" id="canvasPlaceholder">
          <i class="fas fa-cloud-upload-alt"></i>
          <p>Upload an image to start editing</p>
          <button class="btn btn-primary" id="uploadPlaceholderBtn"><i class="fas fa-folder-open"></i> Choose image</button>
        </div>
      </div>
      <div class="footer-note">
        <span class="github-corner"><i class="fab fa-github"></i> <a href="#">PixelForge</a> · Canva & Lightroom inspired</span>
      </div>
    </main>
  </div>

  <!-- toast message -->
  <div class="toast" id="toast"><i class="fas fa-check-circle" style="color: #a78bfa;"></i> <span id="toastMsg">Done</span></div>

  <script>
    (function() {
      // ----- DOM elements -----
      const canvas = document.getElementById('imageCanvas');
      const ctx = canvas.getContext('2d');
      const placeholder = document.getElementById('canvasPlaceholder');
      const fileInput = document.getElementById('fileInput');
      const uploadBtn = document.getElementById('uploadBtn');
      const uploadPlaceholderBtn = document.getElementById('uploadPlaceholderBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const filterCards = document.querySelectorAll('.filter-card');

      // sliders
      const blurSlider = document.getElementById('blurSlider');
      const blurValue = document.getElementById('blurValue');
      const brightnessSlider = document.getElementById('brightnessSlider');
      const brightnessValue = document.getElementById('brightnessValue');
      const contrastSlider = document.getElementById('contrastSlider');
      const contrastValue = document.getElementById('contrastValue');
      const saturateSlider = document.getElementById('saturateSlider');
      const saturateValue = document.getElementById('saturateValue');
      const tintColor = document.getElementById('tintColor');
      const tintSlider = document.getElementById('tintSlider');
      const tintValue = document.getElementById('tintValue');

      // background / remove bg
      const removeBgBtn = document.getElementById('removeBgBtn');
      const setTransparentBtn = document.getElementById('setTransparentBtn');
      const bgSwatches = document.querySelectorAll('.bg-swatch');

      // toast
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');

      // ----- state -----
      let currentImage = null;          // original Image object
      let originalImageData = null;     // ImageData of original (for background removal)
      let currentFilter = 'none';
      let bgColor = null;              // null = transparent, or hex string

      // helper: show toast
      function showToast(msg, isError = false) {
        toastMsg.textContent = msg;
        toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
        toast.style.borderLeftColor = isError ? '#f87171' : '#a78bfa';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2400);
      }

      // ----- apply all filters & adjustments to canvas -----
      function applyEffects() {
        if (!currentImage) {
          // clear canvas and show placeholder
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          placeholder.style.display = 'flex';
          canvas.style.display = 'none';
          return;
        }

        placeholder.style.display = 'none';
        canvas.style.display = 'block';

        // Match canvas dimensions to image (but keep reasonable max)
        const maxW = 900;
        const maxH = 600;
        let w = currentImage.width;
        let h = currentImage.height;
        if (w > maxW || h > maxH) {
          const ratio = Math.min(maxW / w, maxH / h);
          w = w * ratio;
          h = h * ratio;
        }
        canvas.width = w;
        canvas.height = h;

        // 1. draw image on canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // if we have a background color (not transparent), fill canvas first
        if (bgColor && bgColor !== 'transparent') {
          ctx.fillStyle = bgColor;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else if (bgColor === null) {
          // transparent background: leave clear
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // draw the image (with cover / contain?)
        // we'll use contain to avoid cropping
        const scale = Math.min(canvas.width / currentImage.width, canvas.height / currentImage.height);
        const drawW = currentImage.width * scale;
        const drawH = currentImage.height * scale;
        const offsetX = (canvas.width - drawW) / 2;
        const offsetY = (canvas.height - drawH) / 2;
        ctx.drawImage(currentImage, offsetX, offsetY, drawW, drawH);

        // 2. if background removal was used, we need to apply that mask before effects
        // we'll handle removal in a separate function that modifies currentImage (via offscreen canvas)
        // but for background removal we already replaced currentImage with processed version?
        // Actually remove background function will create a new image with white background removed.
        // We'll store that and re-draw.

        // 3. Build filter string (CSS filters on canvas)
        let filterString = '';
        const brightnessVal = brightnessSlider.value / 100; // 1 = 100%
        const contrastVal = contrastSlider.value / 100;
        const saturateVal = saturateSlider.value / 100;

        // base filter from card
        switch (currentFilter) {
          case 'grayscale': filterString += `grayscale(1) `; break;
          case 'sepia': filterString += `sepia(1) `; break;
          case 'invert': filterString += `invert(1) `; break;
          case 'blur': filterString += `blur(${blurSlider.value}px) `; break;
          case 'brightness': filterString += `brightness(${brightnessVal}) `; break;
          case 'contrast': filterString += `contrast(${contrastVal}) `; break;
          case 'saturate': filterString += `saturate(${saturateVal}) `; break;
          default: break;
        }

        // always add blur (even if filter card not blur)
        if (currentFilter !== 'blur' && parseFloat(blurSlider.value) > 0) {
          filterString += `blur(${blurSlider.value}px) `;
        }

        // brightness, contrast, saturation (always applied unless already from card)
        if (currentFilter !== 'brightness') {
          filterString += `brightness(${brightnessVal}) `;
        }
        if (currentFilter !== 'contrast') {
          filterString += `contrast(${contrastVal}) `;
        }
        if (currentFilter !== 'saturate') {
          filterString += `saturate(${saturateVal}) `;
        }

        // Apply CSS filter string to canvas
        ctx.filter = filterString.trim() || 'none';

        // redraw with filter
        // clear again and redraw with background and filter
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (bgColor && bgColor !== 'transparent') {
          ctx.fillStyle = bgColor;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        ctx.filter = filterString.trim() || 'none';
        ctx.drawImage(currentImage, offsetX, offsetY, drawW, drawH);

        // 4. tint overlay (using multiply or screen? we'll use globalCompositeOperation)
        const tintIntensity = tintSlider.value / 100;
        if (tintIntensity > 0) {
          ctx.filter = 'none'; // reset filter for tint layer
          ctx.globalCompositeOperation = 'multiply';
          ctx.fillStyle = tintColor.value;
          ctx.globalAlpha = tintIntensity * 0.7; // max 0.7 for subtle effect
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          // reset
          ctx.globalAlpha = 1.0;
          ctx.globalCompositeOperation = 'source-over';
        }

        // reset filter
        ctx.filter = 'none';

        // update slider labels
        blurValue.textContent = blurSlider.value + 'px';
        brightnessValue.textContent = brightnessSlider.value + '%';
        contrastValue.textContent = contrastSlider.value + '%';
        saturateValue.textContent = saturateSlider.value + '%';
        tintValue.textContent = tintSlider.value + '%';
      }

      // ----- load image into currentImage & reset adjustments -----
      function loadImage(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            currentImage = img;
            // store original image data for background removal (we'll use a separate canvas)
            // reset background to none (transparent)
            bgColor = null;
            updateBgSwatchActive();
            // reset sliders & filters
            resetControls();
            applyEffects();
            showToast('Image loaded ✨');
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      // reset all controls
      function resetControls() {
        // filters
        filterCards.forEach(c => c.classList.remove('active'));
        document.querySelector('.filter-card[data-filter="none"]').classList.add('active');
        currentFilter = 'none';

        blurSlider.value = 0;
        brightnessSlider.value = 100;
        contrastSlider.value = 100;
        saturateSlider.value = 100;
        tintSlider.value = 0;
        tintColor.value = '#a78bfa';
        bgColor = null;
        updateBgSwatchActive();

        // update labels
        blurValue.textContent = '0px';
        brightnessValue.textContent = '100%';
        contrastValue.textContent = '100%';
        saturateValue.textContent = '100%';
        tintValue.textContent = '0%';
      }

      // background swatch active state
      function updateBgSwatchActive() {
        bgSwatches.forEach(sw => {
          if (sw.dataset.bg === bgColor) {
            sw.classList.add('active');
          } else {
            sw.classList.remove('active');
          }
        });
      }

      // ----- Remove background (simple white removal with tolerance) -----
      function removeWhiteBackground() {
        if (!currentImage) {
          showToast('No image loaded', true);
          return;
        }

        // create offscreen canvas at original image size
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d');
        offCanvas.width = currentImage.width;
        offCanvas.height = currentImage.height;
        offCtx.drawImage(currentImage, 0, 0);

        const imageData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
        const data = imageData.data;

        // tolerance for white removal
        const tolerance = 120; // fairly aggressive
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          // if pixel is near white, make transparent
          if (r > 255 - tolerance && g > 255 - tolerance && b > 255 - tolerance) {
            data[i + 3] = 0; // alpha = 0
          }
        }

        offCtx.putImageData(imageData, 0, 0);

        // create new image from offscreen canvas
        const newImg = new Image();
        newImg.onload = () => {
          currentImage = newImg;
          // set background to transparent to show removal
          bgColor = null;
          updateBgSwatchActive();
          applyEffects();
          showToast('White background removed');
        };
        newImg.src = offCanvas.toDataURL();
      }

      // set transparent background (just clear bgColor)
      function setTransparent() {
        if (!currentImage) return;
        bgColor = null;
        updateBgSwatchActive();
        applyEffects();
        showToast('Transparent background');
      }

      // set background color
      function setBackgroundColor(hex) {
        if (!currentImage) return;
        bgColor = hex;
        updateBgSwatchActive();
        applyEffects();
        showToast(`Background set to ${hex}`);
      }

      // download current canvas
      function downloadImage() {
        if (!currentImage) {
          showToast('No image to download', true);
          return;
        }
        const link = document.createElement('a');
        link.download = `pixelforge-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('Download started');
      }

      // ----- event listeners -----

      // upload
      uploadBtn.addEventListener('click', () => fileInput.click());
      uploadPlaceholderBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          loadImage(e.target.files[0]);
          fileInput.value = ''; // reset
        }
      });

      // drag & drop on canvas card
      const canvasCard = document.getElementById('canvasCard');
      canvasCard.addEventListener('dragover', (e) => {
        e.preventDefault();
        canvasCard.style.borderColor = '#a78bfa';
      });
      canvasCard.addEventListener('dragleave', () => {
        canvasCard.style.borderColor = '#2e2e46';
      });
      canvasCard.addEventListener('drop', (e) => {
        e.preventDefault();
        canvasCard.style.borderColor = '#2e2e46';
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
          loadImage(file);
        } else {
          showToast('Please drop an image file', true);
        }
      });

      // filter cards
      filterCards.forEach(card => {
        card.addEventListener('click', () => {
          filterCards.forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          currentFilter = card.dataset.filter;
          // if blur filter selected, reset blur slider? we keep as is but we can set to 3 for effect
          if (currentFilter === 'blur' && blurSlider.value == 0) {
            blurSlider.value = 4;
          }
          applyEffects();
        });
      });

      // sliders
      blurSlider.addEventListener('input', applyEffects);
      brightnessSlider.addEventListener('input', applyEffects);
      contrastSlider.addEventListener('input', applyEffects);
      saturateSlider.addEventListener('input', applyEffects);
      tintSlider.addEventListener('input', applyEffects);
      tintColor.addEventListener('input', applyEffects);

      // background / remove bg
      removeBgBtn.addEventListener('click', removeWhiteBackground);
      setTransparentBtn.addEventListener('click', setTransparent);

      bgSwatches.forEach(sw => {
        sw.addEventListener('click', () => {
          const color = sw.dataset.bg;
          if (color) setBackgroundColor(color);
        });
      });

      // download
      downloadBtn.addEventListener('click', downloadImage);

      // initialize with no image
      applyEffects();

      // also add a small "reset" via filter none (already)
    })();
  </script>
</body>
  </html>
